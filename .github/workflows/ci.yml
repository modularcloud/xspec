# GitHub Actions CI (TEST-SPEC.md section 18; CLAUDE-PROCESS.md section 9).
#
# Jobs:
#
#   harness-self   Linux. Harness self-tests and certification only (TEST-SPEC
#                  17, C-1: certification results are part of the harness's CI
#                  output), run through the same wrapper as suite-linux, with
#                  no product installed: the job builds nothing and packs no
#                  package directory, and confirms dist/ absent and
#                  XSPEC_PACKAGE_DIR unset before they run, so a self-test or
#                  certification that needs the built product or its package
#                  fails here (H-8: they must pass before the product exists,
#                  and the module channel counts as part of the product). E-1's
#                  Node.js releases are provisioned here too (below), for S-10,
#                  which checks the release driver on each of them before any
#                  product exists. This is the signal that must be green
#                  before the product exists (red-green): product-facing tests
#                  may still fail while this job passes. suite-linux runs the
#                  self project again, within its full suite, with the product
#                  built.
#
#   suite-linux    Linux. The full suite — sections 1–17, certification
#                  included (E-1) — run through
#                  .github/scripts/run-without-network.sh: with network access
#                  disabled after dependency installation, so product
#                  invocations run with network denied; as the runner's own
#                  unprivileged identity, so the permission-based stagings of
#                  environment refusals (T13.5-7, T13.5-10(d), T14-9, T14-10)
#                  take effect, the harness verifying each on itself and
#                  reporting a privileged runner as a harness error; and with
#                  the job's administrative access (passwordless sudo) kept
#                  for the harness, which makes 13.5's machine-wide stagings
#                  with it — T13.5-9's second user and second mount,
#                  T13.5-10(e)-(g)'s fresh process-identifier namespaces —
#                  outside every product invocation (E-1, H-2). Workspaces
#                  land in /tmp on the image's ext4 root filesystem (TMPDIR
#                  stays unset), whose name-hash listing order T13.5-10(c)'s
#                  bracketing arm needs. The module channel's two inputs are
#                  set up before the run (below). Expected red until the
#                  product conforms to SPEC.md; green is required from then
#                  on.
#
#   suite-windows  Windows. The E-6 platform-sensitive subset, the
#                  representative fixture's exclusion probe (13.5's busy
#                  refusal, dead-run takeover, and release) among it. The E-6
#                  byte-identity comparison reads the Linux leg's
#                  representative-fixture outputs from the e6-linux-outputs
#                  artifact, exchanged through XSPEC_E6_EXCHANGE_DIR (written
#                  by the harness on the Linux leg, read on the Windows leg).
#
# The module channel (TEST-SPEC H-2, C-2, E-1; SPEC 7.6) runs on the Linux leg
# alone. Its inputs are made at setup, while the network is still available,
# and reach the wrapped run unchanged (run-without-network.sh restores the
# caller's environment exactly):
#
#   Package directory  suite-linux alone. After the build,
#                      .github/scripts/pack-package.sh packs the product with
#                      npm pack, the tarball release.yml's npm publish
#                      uploads, and extracts it under RUNNER_TEMP;
#                      XSPEC_PACKAGE_DIR names the extracted package
#                      directory: exactly what the distribution carries, never
#                      the development tree (H-2).
#   Node.js releases   Both Linux jobs. .github/scripts/provision-node-releases.sh
#                      installs each release test/node-releases.json pins (E-1's
#                      list) under RUNNER_TEMP, each archive checked against
#                      its published SHA-256 sum, beside the release the suite
#                      runs on; XSPEC_NODE_RELEASES_DIR names the directory,
#                      each release's executable at v<version>/bin/node. No
#                      test downloads a runtime, so those runs stay
#                      network-denied (E-1).
#
# Local-only tests (E-2) form a separately invocable local suite
# (`npm run test:local`) and are deliberately excluded here — never silently
# skipped (H-9). That set is currently empty.
name: CI

on:
  pull_request:
  # GitHub creates no pull_request-event runs while a PR is unmergeable. A
  # process branch whose PR is conflicted with main gets its CI signal from
  # push-event runs on its head instead — same workflow, same tree; checks
  # attach to the head commit and surface on the PR — by being listed under
  # push: until its PR is mergeable again or its patch completes
  # (specs/DEVOPS.md, release flow). sdg/initial-build is kept for history;
  # claude/xspec-ui-apis-4df8fa (patch 0001, PR #7) used this channel until
  # its release.
  push:
    branches: [main, sdg/initial-build]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-self:
    name: Harness self-tests + certification (Linux)
    runs-on: ubuntu-24.04
    # A limit of the CI service, not a harness guard (TEST-SPEC S-3). The job
    # took 6.5 minutes at 3d8e7ad, before S-10's checks on E-1's six Node.js
    # releases and S-4's checks of 7.6's covered setups are implemented, and
    # its setup now provisions those releases.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision E-1's Node.js releases (S-10; at setup, before the network is disabled)
        run: |
          bash .github/scripts/provision-node-releases.sh "$RUNNER_TEMP/node-releases"
          echo "XSPEC_NODE_RELEASES_DIR=$RUNNER_TEMP/node-releases" >> "$GITHUB_ENV"
      - name: Typecheck both programs (product and harness)
        run: npm run typecheck
      - name: Confirm no product is installed (H-8; self-tests and certification run before the product exists)
        run: |
          if [ -e dist ]; then
            echo "::error::dist/ exists, but this job runs the harness self-tests and certification with no product installed (TEST-SPEC H-8)"
            exit 1
          fi
          if [ -n "${XSPEC_PACKAGE_DIR+set}" ]; then
            echo "::error::XSPEC_PACKAGE_DIR is set, but this job gives the harness no package directory: the module channel counts as part of the product (TEST-SPEC H-8)"
            exit 1
          fi
      - name: Run harness self-tests and certification (network disabled, unprivileged, administrative access kept)
        run: bash .github/scripts/run-without-network.sh npm run test:self

  suite-linux:
    name: Full suite (Linux, E-1)
    runs-on: ubuntu-24.04
    # A limit of the CI service, not a harness guard (TEST-SPEC S-3): the job
    # is held to GitHub's own per-job limit for hosted runners, 6 hours, and
    # to nothing shorter. It took up to 34 minutes at f22cc77 and 46.5 at
    # 3d8e7ad, before IP 0002's tests of SPEC 7.6 are implemented. Those
    # type-check every arm in all 173 of 7.6's covered setups, a fresh
    # TypeScript 5.9.3 program over a covered file taking about 1 s where the
    # scaffold measured it, and load the module on each of E-1's six Node.js
    # releases, so a shorter limit could stop a conforming run. Where the
    # suite outgrows the service's limit, E-1 splits it across parallel jobs
    # whose union is the whole suite, every verdict reported, never trimming
    # it.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision E-1's Node.js releases (the module channel's; at setup, before the network is disabled)
        run: |
          bash .github/scripts/provision-node-releases.sh "$RUNNER_TEMP/node-releases"
          echo "XSPEC_NODE_RELEASES_DIR=$RUNNER_TEMP/node-releases" >> "$GITHUB_ENV"
      - name: Build the product
        run: npm run build
      - name: Pack the product's package directory exactly as distributed (H-2's module channel, C-2)
        run: |
          package=$(bash .github/scripts/pack-package.sh "$RUNNER_TEMP/xspec-package")
          echo "XSPEC_PACKAGE_DIR=$package" >> "$GITHUB_ENV"
      - name: Run the full suite (network disabled after setup, unprivileged, administrative access kept; E-1)
        run: bash .github/scripts/run-without-network.sh npm test
        env:
          XSPEC_E6_EXCHANGE_DIR: ${{ github.workspace }}/.e6-exchange
      - name: Upload E-6 exchange outputs for the Windows leg
        # Runs regardless of the suite step's verdict (a step without `if:` is
        # skipped once an earlier step fails), so an exchange written by the
        # passing E-6 writer test (test/suite/e6-exchange-writer.test.ts)
        # always reaches the Windows leg even while unrelated Linux product
        # tests are red — the Phase 9 red-green period included. `!cancelled()`
        # rather than `always()`: a cancelled job uploads nothing. The Windows
        # byte-identity test still fails loudly (H-9) exactly when no exchange
        # was written — never because some other Linux test failed. No files
        # exist until the harness writes the representative fixture's outputs
        # into XSPEC_E6_EXCHANGE_DIR on this leg; `if-no-files-found: ignore`
        # keeps this step harmless when the suite step never ran or the writer
        # test wrote nothing. The exchange lives in a dot-directory, which
        # upload-artifact v4 excludes by default (include-hidden-files: false
        # since v4.4) — without the override the written exchange uploads as
        # nothing and the Windows comparison fails loudly on a missing
        # manifest (E-6, H-9).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e6-linux-outputs
          path: .e6-exchange
          include-hidden-files: true
          if-no-files-found: ignore

  suite-windows:
    name: Windows leg (E-6 subset)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: suite-linux
    # Run even when the Linux leg is red (e.g. before the product exists) so
    # the Windows leg keeps reporting its own signal.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the product
        run: npm run build
      - name: Download E-6 exchange outputs from the Linux leg
        # The artifact is absent only when the Linux job produced no exchange
        # (it died before its suite step, or the E-6 writer test itself did not
        # complete) — its upload step runs whenever that job is not cancelled,
        # red product tests notwithstanding. The harness's E-6 comparison must
        # itself fail loudly when the exchange directory is missing while the
        # product exists.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e6-linux-outputs
          path: .e6-exchange
      - name: Run the E-6 platform-sensitive subset
        run: npm run test:windows
        env:
          XSPEC_E6_EXCHANGE_DIR: ${{ github.workspace }}/.e6-exchange
