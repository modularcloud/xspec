# Automated npm releases (DEVOPS.md — npm releases, standing procedure).
#
# Every push to main whose CI run is green is published to the public npm
# registry as @modularcloud/xspec, with a strictly increasing version, and the
# released commit is tagged vX.Y.Z. No human is involved per release.
#
#   Trigger     completion of the CI workflow for a push to main. Publishing
#               hangs off CI's own result, so the never-release-with-red-CI
#               rule is enforced mechanically, and the job checks out exactly
#               the commit CI validated (workflow_run.head_sha).
#   Version     next-version.mjs: package.json's version when it is greater
#               than the latest published version (deliberate bumps land on
#               main as ordinary package.json changes), else latest published
#               with the patch component incremented. The registry and the
#               vX.Y.Z tags are the record of released versions; the bump is
#               not committed back to main.
#   Credential  npm Trusted Publishing (OIDC) — no long-lived secret. The job
#               upgrades npm to >= 11.5.1 (Node 22 bundles npm 10, which
#               cannot do the OIDC exchange); npm publish then trades the
#               workflow's GitHub Actions OIDC token for short-lived publish
#               credentials, minted only for the Trusted Publisher configured
#               on npmjs.com (owner modularcloud, repository xspec, workflow
#               release.yml). The NPM_TOKEN repository secret is a
#               bootstrap-only fallback, honored automatically when the OIDC
#               exchange is unavailable (e.g. before the Trusted Publisher is
#               configured). Publish failures fail the run loudly with setup
#               instructions — a release is never silently skipped — and
#               re-running a failed run is safe: the registry refuses to
#               republish an existing version.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# contents: write pushes the vX.Y.Z tag; id-token: write lets npm publish
# mint the GitHub OIDC token used for trusted publishing and provenance.
permissions:
  contents: write
  id-token: write

# Queue releases rather than cancelling one mid-publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @modularcloud/xspec to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the product
        run: npm run build
      # The install and build above run on the stock toolchain CI validated;
      # the upgrade below affects publishing only.
      - name: Upgrade npm for trusted publishing (the OIDC exchange needs >= 11.5.1)
        run: |
          npm install -g "npm@^11.5.1"
          V="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error("::error::npm " + process.argv[1] + " cannot do the npm Trusted Publishing OIDC exchange (needs >= 11.5.1), so this green main commit was NOT published. Fix the npm upgrade step in .github/workflows/release.yml, then re-run this workflow run.");
              process.exit(1);
            }
          ' "$V"
          echo "Publishing with npm $V"
      - name: Compute the release version (strictly increasing)
        id: version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          BASELINE="$(node -p "require('./package.json').version")"
          LATEST="$(npm view "$NAME" version 2>/dev/null || true)"
          NEXT="$(node .github/scripts/next-version.mjs "$BASELINE" "$LATEST")"
          echo "Package $NAME — baseline $BASELINE, latest published ${LATEST:-<none>}, releasing $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (OIDC trusted publishing; NPM_TOKEN as bootstrap fallback)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            # Bootstrap-only fallback: npm >= 11.5.1 still attempts the OIDC
            # exchange first and reaches for this token only when that
            # exchange is unavailable.
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "NPM_TOKEN secret found — kept as bootstrap fallback in case the OIDC exchange is not configured yet."
          else
            echo "No NPM_TOKEN secret — publishing via the OIDC trusted-publishing exchange."
          fi
          # --allow-same-version: a first release publishes package.json's own
          # version, so the bump is a no-op that plain `npm version` rejects.
          if ! { npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version &&
                 npm publish --provenance --access public; }; then
            echo "::error::Publishing @modularcloud/xspec@${{ steps.version.outputs.next }} failed, so this green main commit was NOT released — see the npm error above. If it is an auth error (E401/E403/E404/ENEEDAUTH), the one-time npm-side setup (specs/DEVOPS.md — npm releases, Credentials) is incomplete: configure the package's Trusted Publisher on npmjs.com (GitHub Actions: owner modularcloud, repository xspec, workflow release.yml) — or, for bootstrap only, set the NPM_TOKEN repository secret. Then re-run this workflow run: it publishes exactly this commit, and duplicate attempts are safe because the registry refuses to republish an existing version."
            exit 1
          fi
      - name: Tag the released commit
        run: |
          git tag "v${{ steps.version.outputs.next }}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "v${{ steps.version.outputs.next }}"
